# Configuração usada apenas pelos testes automatizados.
# Banco H2 em memória: os testes rodam sem PostgreSQL e sem variáveis de ambiente.
spring.application.name=portal-solicitacoes

jwt.secret=chave-de-teste-com-pelo-menos-32-caracteres-para-hs256
jwt.expiration=3600000

spring.datasource.url=jdbc:h2:mem:portal;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop


app.cors.allowed-origins=http://localhost:3000
